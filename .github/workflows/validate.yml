name: Validate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check for file formatting issues or outdated index.json
        run: |
          shopt -s globstar
          tools/reformat-json.sh **/*.json
          if [[ -n $(git status --porcelain) ]]; then
              git status
              echo "Some JSON files are formatted incorrectly. Please check the README on how to reformat your files."
              exit 1
          fi

          tools/update-index.py
          if [[ -n $(git status --porcelain) ]]; then
              echo "The index.json file is outdated."
              exit 1
          fi
      - name: Validate JSON files against the schemas
        run: |
          shopt -s globstar
          pipx install check-jsonschema
          check-jsonschema --schemafile schema/map.schema.json maps/**/*.map.json
          check-jsonschema --schemafile schema/platform.schema.json platforms/*.json
          check-jsonschema --schemafile schema/index.schema.json index.json
          check-jsonschema --schemafile schema/romnames.schema.json romnames.json
